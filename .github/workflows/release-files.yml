name: Build

on:
  push:
    tags:
      - "*"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.

jobs:
  create_release:
    name: Create Release
    runs-on: ubuntu-latest
    environment: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      # the notes of a release are its section of CHANGELOG.md
      - name: Extract release notes
        run: awk -v v="${{ github.ref_name }}" '/^## /{f = ($2 == v); next} f' CHANGELOG.md > notes.md
      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          body_path: notes.md
          generate_release_notes: true

  build_release:
    name: Build Release
    needs: create_release
    environment: build
    outputs:
      output_linux_amd: ${{ steps.compute_sha.outputs.output_LINUX_AMD_SHA }}
      output_linux_arm: ${{ steps.compute_sha.outputs.output_LINUX_ARM_SHA }}
      output_mac_amd: ${{ steps.compute_sha.outputs.output_MAC_AMD_SHA }}
      output_mac_arm: ${{ steps.compute_sha.outputs.output_MAC_ARM_SHA }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            release_suffix: linux-amd
            compile_options: --target=bun-linux-x64-modern
            sha_field: LINUX_AMD_SHA
          - os: ubuntu-latest
            release_suffix: linux-arm
            compile_options: --target=bun-linux-arm64
            sha_field: LINUX_ARM_SHA
          - os: macos-latest
            release_suffix: mac
            compile_options: --target=bun-darwin-arm64
            sha_field: MAC_ARM_SHA
          - os: macos-15
            release_suffix: mac_intel
            platform: x64
            compile_options: --target=bun-darwin-x64
            sha_field: MAC_AMD_SHA
    runs-on: ${{ matrix.os }}
    steps:
      - uses: oven-sh/setup-bun@v2
      - name: Checkout code
        uses: actions/checkout@v4
      - run: bun install
      - run: bun make:exe ${{ matrix.compile_options }}
      # bun 1.4 leaves an invalid ad-hoc signature: macOS kills the binary at launch
      - name: Re-sign macOS binary
        if: runner.os == 'macOS'
        run: codesign --force --sign - ./exe/slidesk
      - name: Rename release package
        id: release_package
        run: |
            cat ./exe/slidesk > slidesk_${{ matrix.release_suffix }}
      - name: Compress action step
        uses: a7ul/tar-action@v1.2.0
        id: compress
        with:
          command: c
          cwd: .
          files: |
            ./slidesk_${{ matrix.release_suffix }}
          outPath: ./slidesk_${{ matrix.release_suffix }}.tar.gz
      - name: Compute sha
        id: compute_sha
        run: |
            sha=($(shasum -a 256 ./slidesk_${{ matrix.release_suffix }}.tar.gz))
            sha_value="${{ matrix.sha_field }}"
            echo "output_${sha_value}=${{ matrix.sha_field }}-$sha" >> "$GITHUB_OUTPUT"
      - name: Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # This token is provided by Actions, you do not need to create your own token
        with:
          tag_name: ${{ needs.create_release.outputs.tag-name }}
          files: slidesk_${{ matrix.release_suffix }}.tar.gz

  build_windows:
    name: Build Windows release
    needs: create_release
    environment: build
    runs-on: ubuntu-latest
    steps:
      - uses: oven-sh/setup-bun@v2
      - name: Checkout code
        uses: actions/checkout@v4
      - run: bun install
      - run: bun build src/index.ts --compile --minify --target=bun-windows-x64 --outfile slidesk.exe
      - run: zip slidesk_windows.zip slidesk.exe
      - name: Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: slidesk_windows.zip

  update_brew_formula:
    name: Update formula
    runs-on: ubuntu-latest
    needs: build_release
    steps:
      - name: Update formula
        uses: yodamad-actions/brew-formula-update@0.5
        with:
          file: slidesk.rb
          owner: gouz
          repo: homebrew-tools
          version: ${{ github.ref_name }}
          # the action reads `fields` and `auto_merge` (its action.yml lists
          # other names, hence a harmless "unexpected input" warning)
          fields: ${{ toJSON(needs.build_release.outputs) }}
          token: ${{ secrets.BREW_TOKEN }}
          # merging right after creating the pull request races GitHub's
          # mergeability check ("405 Base branch was modified"): merged below
          auto_merge: false
      - name: Merge formula pull request
        env:
          GH_TOKEN: ${{ secrets.BREW_TOKEN }}
          TITLE: Update slidesk.rb to ${{ github.ref_name }}
        run: |
          pr=$(gh pr list --repo gouz/homebrew-tools --state open --search "$TITLE in:title" --json number,title --jq "map(select(.title == env.TITLE))[0].number")
          if [ -z "$pr" ]; then echo "no open pull request titled: $TITLE"; exit 1; fi
          for attempt in 1 2 3 4 5 6; do
            gh pr merge "$pr" --repo gouz/homebrew-tools --merge && exit 0
            sleep 10
          done
          exit 1

  push_docker_hub:
    name: Push on Docker Hub
    runs-on: ubuntu-latest
    environment: build
    needs: build_release
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_LOGIN }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - uses: docker/metadata-action@v5
        id: metadata

      - name: Build and push
        uses: docker/bake-action@v6
        env:
          TAG_VERSION: ${{ github.ref_name }}
        with:
          files: .github/docker/docker-bake.hcl
          push: true

  generate_deb:
    name: Build packages file
    needs: create_release
    runs-on: ubuntu-latest
    steps:
      - uses: oven-sh/setup-bun@v2
      - name: Checkout code
        uses: actions/checkout@v4
      - run: bun install
      - run: bun make:exe
      - name: create sample script
        run: |
          mkdir -p .debpkg/usr/bin
          cp -p exe/* .debpkg/usr/bin/
      - name: build-deb-action
        uses: jiro4989/build-deb-action@v3
        with:
          package: "slidesk"
          desc: "Your presentation companion"
          arch: "amd64"
          package_root: ".debpkg"
          maintainer: "Sylvain Gougouzian <sylvain@gougouzian.fr>"
          version: ${{ github.ref_name }}
      - name: Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # This token is provided by Actions, you do not need to create your own token
        with:
          tag_name: ${{ needs.create_release.outputs.tag-name }}
          files: slidesk_${{ github.ref_name }}_amd64.deb
